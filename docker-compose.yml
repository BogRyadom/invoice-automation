name: invoice-automation

# Postgres, Storage and Auth come from the local Supabase stack (`npx supabase start`).
# Containers reach it through the host, so the host-side URLs from .env are overridden here.
x-backend: &backend
  build: ./api
  image: invoice-automation-api:local
  env_file:
    - path: .env
      required: true
  environment:
    DATABASE_URL: postgresql+psycopg://postgres:postgres@host.docker.internal:54322/postgres
    SUPABASE_URL: http://host.docker.internal:54321
    N8N_WEBHOOK_URL: http://n8n:5678/webhook/invoice-events
  extra_hosts:
    - "host.docker.internal:host-gateway"
  restart: unless-stopped

services:
  api:
    <<: *backend
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    depends_on:
      api:
        condition: service_healthy

  web:
    build: ./web
    image: invoice-automation-web:local
    ports:
      - "3000:3000"
    restart: unless-stopped

  # Triggers and notifications only (docs/SPEC.md section 12). It gets just the variables its
  # workflows use; Gmail, Sheets and Slack credentials are created in the n8n UI.
  n8n:
    image: n8nio/n8n:2.42.3
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: UTC
      N8N_LOG_LEVEL: ${N8N_LOG_LEVEL:-info}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      API_URL: http://api:8000
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      INGEST_SHARED_SECRET: ${INGEST_SHARED_SECRET}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      GOOGLE_SHEET_ID: ${GOOGLE_SHEET_ID:-}
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

volumes:
  n8n_data:
