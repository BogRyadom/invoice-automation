name: invoice-automation

# Postgres, Storage and Auth come from the local Supabase stack (`npx supabase start`).
# Containers reach it through the host, so the host-side URLs from .env are overridden here.
x-backend: &backend
  build: ./api
  image: invoice-automation-api:local
  env_file:
    - path: .env
      required: true
  environment:
    DATABASE_URL: postgresql+psycopg://postgres:postgres@host.docker.internal:54322/postgres
    SUPABASE_URL: http://host.docker.internal:54321
  extra_hosts:
    - "host.docker.internal:host-gateway"
  restart: unless-stopped

services:
  api:
    <<: *backend
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    depends_on:
      api:
        condition: service_healthy

  web:
    build: ./web
    image: invoice-automation-web:local
    ports:
      - "3000:3000"
    restart: unless-stopped
