[project]
name = "invoice-api"
version = "0.1.0"
description = "Invoice processing API and worker"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.142.2",
    "groq>=1.7.0",
    "pdfplumber>=0.11.10",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.1",
    "pypdfium2>=5.14.0",
    "python-multipart>=0.0.32",
    "rapidfuzz>=3.14.6",
    "sqlalchemy>=2.1.3",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[dependency-groups]
dev = [
    "google-api-python-client>=2.201.0",
    "google-auth-oauthlib>=1.5.0",
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "reportlab>=5.0.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
addopts = "-ra --strict-markers"
markers = ["db: requires a Postgres database (TEST_DATABASE_URL)"]
